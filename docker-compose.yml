services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mirofish_neo4j}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-mirofish_neo4j}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mirofish:
    # Published from this fork's `dev` branch via GitHub Actions → GHCR
    image: ${MIROFISH_IMAGE:-ghcr.io/hubentu/mirofish:dev}
    # Local build instead of pull:
    # build: .
    container_name: mirofish
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  neo4j_data:
